# Testes: banco em memória H2, não precisa de Postgres
# Hibernate: biblioteca que trabalha por baixo do Spring Data JPA. Ela que transforma suas classes Java em tabelas do banco.
# DDL: comandos de banco que criam ou mudam tabelas
spring.datasource.url=jdbc:h2:mem:atalaia;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
