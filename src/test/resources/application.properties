# Testes: banco em memória H2, não precisa de Postgres
# Hibernate: biblioteca que trabalha por baixo do Spring Data JPA. Ela que liga suas classes Java às tabelas do banco.
# DDL: comandos de banco que criam ou mudam tabelas
# Nos testes o Flyway roda as mesmas migrações no H2, e o Hibernate só confere (validate)
spring.datasource.url=jdbc:h2:mem:atalaia;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
