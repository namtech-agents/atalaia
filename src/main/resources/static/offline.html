<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e3e7eb">
  <title>Sem conexão · Atalaia</title>
  <link rel="icon" href="/logo/atalaia-simbolo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/atalaia.css">
</head>
<body>
<!-- A tela que o app instalado mostra sem internet (o sw.js entrega esta página). É estática: não tem dado nenhum.
     Layout próprio (sem a grade das telas com menu), centrado e dentro da área segura do iPhone -->
<main class="sem-conexao">
  <img src="/logo/atalaia-simbolo.svg" alt="" width="48" height="48">
  <h1>Sem conexão</h1>
  <p>Não deu para falar com o Atalaia. Confira a internet e tente de novo. Nada do escritório fica guardado neste aparelho.</p>
  <!-- href vazio: recarrega o endereço que a pessoa tentou abrir (esta página é entregue no lugar dele), sem script -->
  <a class="botao cheio" href="">Tentar de novo</a>
</main>
</body>
</html>
