spring.application.name=atalaia
# Banco local: Postgres.app, banco: atalaia. Em produção, vem de variáveis de ambiente
spring.datasource.url=${ATALAIA_DB_URL:jdbc:postgresql://localhost:5432/atalaia}
# jdbc é o jeito do java falar com o banco, o $ serve pra dizer que esse texto não é pra usar como está, é uma variável, troque pelo valor dela.
spring.datasource.username=${ATALAIA_DB_USUARIO:${USER}}
spring.datasource.password=${ATALAIA_DB_SENHA:}
spring.jpa.open-in-view=false
# Quem cria e muda tabela é o Flyway (db/migration). O Hibernate só confere se as classes batem com o banco
spring.jpa.hibernate.ddl-auto=validate

# Só a saúde do sistema fica exposta
management.endpoints.web.exposure.include=health
# Flyway: db/exemplo ficou só com um arquivo vazio. Ele já foi registrado nos bancos existentes, e o Flyway reclamaria se sumisse
spring.flyway.locations=classpath:db/migration,classpath:db/exemplo

# Envio de PDF: o Atalaia recusa com mensagem acima de 10 MB; este limite maior é a trava do servidor
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

# Cookie da sessão (quem entrou). same-site=lax: o navegador não manda o cookie em pedido disparado por outro site
server.servlet.session.cookie.same-site=lax
# secure: o cookie só viaja por HTTPS. No Mac (http://localhost) fica desligado; no ar, ligar com ATALAIA_COOKIE_SEGURO=true
server.servlet.session.cookie.secure=${ATALAIA_COOKIE_SEGURO:false}
# A sessão só anda pelo cookie, nunca escrita no endereço (;jsessionid=...), que vaza em histórico e em link copiado
server.servlet.session.tracking-modes=cookie

# O endereço do Atalaia como o cliente ve, usado no link do aviso (ex.: https://atalaia.exemplo.com.br).
# No Mac fica vazio e o link sai com o endereço de onde a tela foi aberta; no ar, definir ATALAIA_ENDERECO
atalaia.endereco-publico=${ATALAIA_ENDERECO:}
