spring.application.name=atalaia
# Banco local: Postgres.app, banco: atalaia. Em produção, vem de variáveis de ambiente
spring.datasource.url=${ATALAIA_DB_URL:jdbc:postgresql://localhost:5432/atalaia}
# jdbc é o jeito do java falar com o banco, o $ serve pra dizer que esse texto não é pra usar como está, é uma variável, troque pelo valor dela.
spring.datasource.username=${ATALAIA_DB_USUARIO:${USER}}
spring.datasource.password=${ATALAIA_DB_SENHA:}
spring.jpa.open-in-view=false

# Só a saúde do sistema fica exposta
management.endpoints.web.exposure.include=health