<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeca(${erro != null} ? 'Erro · Criar conta' : 'Criar conta')}"></head>
<body>
<div th:replace="~{fragmentos :: campo}"></div>
<div class="pagina">
  <header th:replace="~{fragmentos :: topo}"></header>

  <main>
    <div class="titulo">
      <h1>Criar a conta do escritório</h1>
      <p>A conta nasce com o seu escritório. Depois de entrar, você cadastra as empresas que atende.</p>
    </div>

    <form class="vidro formulario" method="post" th:action="@{/cadastro}">
      <p class="erro" id="erro-cadastro" role="alert" th:if="${erro}" th:text="${erro}"></p>

      <div>
        <label class="rotulo" for="escritorio">Nome do escritório</label>
        <!-- Só o campo que falhou recebe o foco e o aviso de erro (campoComErro vem do ContaController) -->
        <input id="escritorio" name="escritorio" type="text" maxlength="200" autocomplete="organization" required
               th:value="${escritorio}" th:autofocus="${campoComErro == 'escritorio'}"
               th:attr="aria-invalid=${campoComErro == 'escritorio'} ? 'true', aria-describedby=${campoComErro == 'escritorio'} ? 'erro-cadastro'">
      </div>
      <div>
        <label class="rotulo" for="email">E-mail</label>
        <input id="email" name="email" type="email" maxlength="254" autocomplete="username" required
               th:value="${email}" th:autofocus="${campoComErro == 'email'}"
               th:attr="aria-invalid=${campoComErro == 'email'} ? 'true', aria-describedby=${campoComErro == 'email'} ? 'erro-cadastro'">
      </div>
      <div>
        <label class="rotulo" for="senha">Senha</label>
        <!-- A senha não volta preenchida depois de um erro: ela nunca é escrita de volta na página -->
        <input id="senha" name="senha" type="password" minlength="8" autocomplete="new-password" required
               aria-describedby="dica-senha" th:autofocus="${campoComErro == 'senha'}"
               th:attr="aria-invalid=${campoComErro == 'senha'} ? 'true', aria-describedby=${campoComErro == 'senha'} ? 'erro-cadastro dica-senha' : 'dica-senha'">
        <p class="dica" id="dica-senha">Pelo menos 8 caracteres. Uma frase comprida é melhor que uma senha curta e complicada.</p>
      </div>
      <div>
        <!-- A senha é digitada sem aparecer: repetir pega o erro de digitação -->
        <label class="rotulo" for="senhaRepetida">Repita a senha</label>
        <input id="senhaRepetida" name="senhaRepetida" type="password" minlength="8" autocomplete="new-password" required>
      </div>

      <button class="botao cheio" type="submit">Criar conta</button>

      <p class="aviso">O e-mail serve só para você entrar no Atalaia. Já tem conta? <a th:href="@{/entrar}">Entrar</a></p>
    </form>
  </main>
</div>
</body>
</html>
