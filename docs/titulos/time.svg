<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 60" role="img" aria-label="Time" shape-rendering="crispEdges">
<title>Time</title>
<style>
.feito{opacity:0;animation:feito 8s steps(1,end) infinite}
@keyframes feito{0%,86%{opacity:1}87%,100%{opacity:0}}
.t0{animation-delay:0.60s}.t1{animation-delay:0.63s}.t2{animation-delay:0.65s}.t3{animation-delay:0.68s}.t4{animation-delay:0.71s}.t5{animation-delay:0.73s}.t6{animation-delay:0.76s}.t7{animation-delay:0.79s}.t8{animation-delay:0.81s}
.marca{animation:anda 8s infinite}
@keyframes anda{
0%,7.50%{transform:translateX(64px)}
7.51%{transform:translateX(64px);animation-timing-function:steps(7,end)}
10.00%,100%{transform:translateX(124px)}}
/* Quem pediu menos movimento vê a régua parada, com a marca no começo */
@media (prefers-reduced-motion:reduce){*{animation:none!important}.marca{transform:translateX(64px)}}
</style>
